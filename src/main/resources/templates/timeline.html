<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="/styles/TimeLineStyleMy.css"/>
<!-- Bootstrap core CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<head>
    <meta charset="UTF-8">
    <title>Timeline</title>
</head>
<body>
<header th:insert="~{parts/header :: header}"></header>

<!-- Главный контейнер -->
<div class="main_container">
    <!-- Контейнер боковой панелли -->
    <div class="sidebar_container">
        <h2>Боковая паннель</h2>
    </div>
    <!-- Контейнер боковой панелли -->
    <!-- Контейнер таймлайна -->
    <div class="timeline_container" id="timeline_container">
    <h2>Контейнер таймлайна</h2>
        <div class="hours_container" id="hours_container">

        </div>
    </div>
    <!-- Контейнер таймлайна -->

    <!-- Контейнер операций -->
    <div class="operations_container">
        <h2>Доступные производственные операции</h2>

            <div class="operations-list" id="operations-list">
                <div th:each="op : ${operations}"
                     class="operation-card"
                     th:data-operation-id="${op.id}"
                     th:data-operation-name="${op.name}"
                     th:data-operation-time="${op.time}"
                     draggable="true"
                     th:attr="data-tooltip=|Номер ЗНП: ${op.number}
              Название: ${op.name}
              Время: ${#numbers.formatDecimal(op.time, 1, 3)} мин
              Номенклатура: ${op.nomenclatureName}|">
                    <span th:text="${op.name + ' (' + #numbers.formatDecimal(op.time, 1, 2) + ' мин)'}"></span>
                    <span class="delete-btn" th:data-id="${op.id}">×</span>
                </div>
            </div>
    </div>
    <!-- Контейнер операций -->
</div>
<!-- Главный контейнер -->

<header th:insert="~{parts/footer :: footer}"></header>
<script src="/scripts/TimeLineScriptMy.js"></script>
</body>
</html>
