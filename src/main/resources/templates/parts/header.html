<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="p-3 bg-dark text-white">
    <div class="header-header-container" th:fragment="header">
        <div class="header-flex-container">
            <!-- Логотип - прижат к самому левому краю -->
            <div class="header-logo-container">
                <a href="/" class="d-flex text-white text-decoration-none">
                    <img src="/img/LogoRus.png" height="50" width="250" id="Icon1"/>
                </a>
            </div>

            <!-- Навигация -->
            <ul class="header-nav">
                <li><a href="#" class="nav-link px-2 text-secondary">Главная</a></li>
                <li><a href="#" class="nav-link px-2 text-white">Статистика</a></li>
                <li><a href="#" class="nav-link px-2 text-white">Что-то еще</a></li>
            </ul>

            <!-- Кнопки - прижаты к правому краю -->
            <div class="header-buttons">
                <button type="button" class="btn btn-outline-light me-2">Войти</button>
                <button type="button" class="btn btn-warning">Регистрация</button>
            </div>
        </div>
    </div>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
</html>
